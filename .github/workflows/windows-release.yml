name: Crear aplicación para Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar interfaz Angular
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-build.txt

      - name: Instalar empaquetador
        run: python -m pip install -r backend/requirements-build.txt

      - name: Crear ejecutable
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --name AtencionCliente
          --add-data "frontend/dist/frontend/browser;frontend/dist/frontend/browser"
          --collect-all engineio
          --collect-all socketio
          backend/app.py

      - name: Crear suma de verificación
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AtencionCliente.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AtencionCliente.exe" | Set-Content -Encoding ascii dist/AtencionCliente.exe.sha256

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AtencionCliente-Windows
          path: |
            dist/AtencionCliente.exe
            dist/AtencionCliente.exe.sha256

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          name: Sistema de atención a clientes ${{ github.ref_name }}
          body: |
            Aplicación portátil para Windows.

            1. Descarga `AtencionCliente.exe`.
            2. Haz doble clic en el archivo.
            3. El sistema abrirá automáticamente el navegador.

            Los turnos se guardan en memoria y se reinician al cerrar la aplicación.
          files: |
            dist/AtencionCliente.exe
            dist/AtencionCliente.exe.sha256

